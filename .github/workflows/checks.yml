name: code-and-contracts
on:
  push:
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: python -m pip install -e '.[test]'
      - run: pytest -q tests/unit tests/contract
      - run: SPARK_LOCAL_IP=127.0.0.1 pytest -q tests/integration
