services:
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,PLAINTEXT_INTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 168
    healthcheck:
      test: ["CMD-SHELL", "cub kafka-ready -b kafka:29092 1 5"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  init-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: init-kafka
    depends_on:
      kafka:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        echo 'Creating Kafka topics...'
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic stock-price-topic --replication-factor 1 --partitions 3
        kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic news-topic --replication-factor 1 --partitions 3
        echo 'Current Kafka topics:'
        kafka-topics --bootstrap-server kafka:29092 --list

  collector:
    build:
      context: .
      dockerfile: Dockerfile
    image: vn30-bigdata-pipeline:latest
    container_name: vn30-collector
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      COLLECTOR_STATE_DIR: /app/data/.collector_state
    volumes:
      - ../data:/app/data
    command: ["python", "-u", "data_ingestion/auto_collector_1m.py"]
    restart: unless-stopped

  bronze-sink:
    build:
      context: .
      dockerfile: Dockerfile
    image: vn30-bigdata-pipeline:latest
    container_name: vn30-bronze-sink
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
      BRONZE_FLUSH_INTERVAL_SECONDS: "3600"
    volumes:
      - ../data:/app/data
    command: ["python", "-u", "data_ingestion/bronze_sink_consumer.py", "--flush-interval", "3600"]
    restart: unless-stopped

  replay-producer:
    build:
      context: .
      dockerfile: Dockerfile
    image: vn30-bigdata-pipeline:latest
    container_name: vn30-replay-producer
    profiles: ["tools"]
    depends_on:
      init-kafka:
        condition: service_completed_successfully
    environment:
      KAFKA_BROKERS: kafka:29092
    volumes:
      - ../data:/app/data
    command: ["python", "-u", "data_ingestion/replay_producer.py", "--bars", "5", "--speed", "1", "--include-news"]
